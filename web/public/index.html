<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viper Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="view-login" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="currentColor"/>
        </svg>
        <span>Viper Admin</span>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Enter your administrator password to continue.</p>
      <label class="field">
        <span>Password</span>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p id="login-error" class="error-text hidden"></p>
    </form>
  </div>

  <div id="view-app" class="app-wrap hidden">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="currentColor"/>
        </svg>
        <span>Viper Admin</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="keys">Keys</button>
        <button class="nav-item" data-view="announcements">Announcements</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div id="storage-badge" class="storage-badge"></div>
        <button id="logout-btn" class="btn btn-ghost btn-block">Sign out</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h2 id="page-title">Overview</h2>
        <div id="page-actions"></div>
      </header>
      <div id="page-content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
